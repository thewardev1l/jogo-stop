<!doctype html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width,initial-scale=1"
>

<title>STOP Multiplayer</title>

<style>

*{
    box-sizing:border-box;
}

body{
    font-family:Arial;
    background:#111827;
    color:white;
    text-align:center;
    margin:0;
    padding:25px;
}

main{
    max-width:900px;
    margin:auto;
}

.card{
    background:#1f2937;
    padding:25px;
    border-radius:18px;
    margin:15px 0;
    box-shadow:0 5px 20px rgba(0,0,0,.25);
}

input,
button{
    padding:13px;
    margin:6px;
    border-radius:10px;
    border:0;
    font-size:16px;
}

input{
    width:85%;
}

button{
    background:#22c55e;
    color:#000;
    font-weight:bold;
    cursor:pointer;
}

button:hover{
    opacity:.85;
}

button:disabled{
    cursor:not-allowed;
    opacity:.55;
}

.danger{
    background:#ef4444;
    color:white;
}

#codigo{
    font-size:45px;
    font-weight:bold;
    letter-spacing:8px;
}

#letra{
    font-size:70px;
    font-weight:bold;
    color:#22c55e;
}

#tempo{
    font-size:28px;
    font-weight:bold;
    margin:15px;
}

#tempoVotacao{
    font-size:28px;
    font-weight:bold;
    margin:15px;
}

.cats{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:15px;
}

.categoria{
    background:#374151;
    padding:15px;
    border-radius:12px;
}

.player{
    display:inline-block;
    background:#374151;
    padding:8px 12px;
    margin:4px;
    border-radius:8px;
}

.votacao-resposta{
    background:#374151;
    padding:20px;
    margin:15px 0;
    border-radius:15px;
    transition:.2s;
}

.votacao-resposta.votou{
    border:3px solid #22c55e;
    background:#263d31;
}

.votacao-resposta.propria{
    border:3px solid #6b7280;
}

.nome-jogador{
    font-size:20px;
    font-weight:bold;
}

.resposta-texto{
    font-size:27px;
    font-weight:bold;
    margin:15px;
    word-break:break-word;
}

.botoes-voto button{
    min-width:140px;
}

.correct{
    background:#22c55e;
    color:white;
}

.wrong{
    background:#ef4444;
    color:white;
}

.voto-mensagem{
    color:#22c55e;
    font-weight:bold;
    margin-top:12px;
}

.sem-voto{
    color:#9ca3af;
    margin-top:10px;
}

.aprovada{
    border:3px solid #22c55e;
}

.reprovada{
    border:3px solid #ef4444;
}

.empate{
    border:3px solid #facc15;
}

.resultado-jogador{
    background:#374151;
    padding:15px;
    margin:10px 0;
    border-radius:12px;
}

.primeiro{
    border:3px solid #facc15;
}

.hidden{
    display:none !important;
}

@media(max-width:600px){

    body{
        padding:10px;
    }

    .cats{
        grid-template-columns:1fr;
    }

    input{
        width:95%;
    }

    button{
        width:90%;
    }

    #letra{
        font-size:55px;
    }

    #codigo{
        font-size:35px;
    }

}

</style>

</head>

<body>

<main>

<h1>🛑 STOP</h1>

<div id="status">
🔴 Conectando...
</div>


<!-- ========================================= -->
<!-- MENU -->
<!-- ========================================= -->

<div
    id="menu"
    class="card"
>

<h2>Entrar no jogo</h2>

<input
    id="nome"
    placeholder="Seu nome"
    maxlength="20"
>

<br>

<button onclick="criar()">
🏠 Criar sala
</button>

<br>

<input
    id="codin"
    placeholder="Código da sala"
    maxlength="6"
>

<button onclick="entrar()">
🚪 Entrar
</button>

</div>


<!-- ========================================= -->
<!-- JOGO -->
<!-- ========================================= -->

<div
    id="jogo"
    class="hidden"
>


<!-- SALA -->

<div
    id="salaCard"
    class="card"
>

<h2>
Código da sala
</h2>

<div id="codigo"></div>

<div id="players"></div>

<button
    id="start"
    onclick="iniciar()"
>
▶️ Iniciar rodada
</button>

</div>


<!-- ========================================= -->
<!-- RESPONDER -->
<!-- ========================================= -->

<div
    id="respostasCard"
    class="card"
>

<h2>
📝 Responda!
</h2>

<div id="letra">
?
</div>

<div id="tempo">
</div>

<div
    id="cats"
    class="cats"
></div>

<br>

<button onclick="enviar()">
📤 Salvar respostas
</button>

<button
    class="danger"
    onclick="enviarStop()"
>
🛑 STOP!
</button>

</div>


<!-- ========================================= -->
<!-- VOTAÇÃO -->
<!-- ========================================= -->

<div
    id="votacaoCard"
    class="card hidden"
>

<h2 id="tituloVotacao">
🗳️ Votação
</h2>

<div id="progresso"></div>

<div id="tempoVotacao">
</div>

<p>
Analise as respostas dos outros jogadores.
</p>

<div id="votacoes">
</div>

</div>


<!-- ========================================= -->
<!-- RESULTADO DA CATEGORIA -->
<!-- ========================================= -->

<div
    id="resultadoVotacaoCard"
    class="card hidden"
>

<h2>
⚖️ Resultado da votação
</h2>

<div id="resultadoVotacao">
</div>

</div>


<!-- ========================================= -->
<!-- RESULTADO FINAL -->
<!-- ========================================= -->

<div
    id="res"
    class="card hidden"
>
</div>


</div>

</main>


<script src="/socket.io/socket.io.js"></script>

<script>

const s = io();


let dono = false;

let salaAtual = null;

let categoriaAtual = null;


// Guarda quais respostas
// o jogador atual já votou

const meusVotos = {};


// ==============================================
// ELEMENTOS
// ==============================================

const menu =
document.getElementById("menu");

const jogo =
document.getElementById("jogo");

const nomeInput =
document.getElementById("nome");

const codigoInput =
document.getElementById("codin");

const codigo =
document.getElementById("codigo");

const players =
document.getElementById("players");

const start =
document.getElementById("start");

const letra =
document.getElementById("letra");

const tempo =
document.getElementById("tempo");

const cats =
document.getElementById("cats");

const respostasCard =
document.getElementById(
    "respostasCard"
);

const votacaoCard =
document.getElementById(
    "votacaoCard"
);

const votacoes =
document.getElementById(
    "votacoes"
);

const tituloVotacao =
document.getElementById(
    "tituloVotacao"
);

const progresso =
document.getElementById(
    "progresso"
);

const tempoVotacao =
document.getElementById(
    "tempoVotacao"
);

const resultadoVotacaoCard =
document.getElementById(
    "resultadoVotacaoCard"
);

const resultadoVotacao =
document.getElementById(
    "resultadoVotacao"
);

const res =
document.getElementById("res");


// ==============================================
// CONEXÃO
// ==============================================

s.on(
    "connect",
    () => {

        status(
            "🟢 Conectado ao servidor!"
        );

    }
);


s.on(
    "connect_error",
    () => {

        status(
            "🔴 Servidor não conectado"
        );

    }
);


s.on(
    "erro",
    mensagem => {

        alert(mensagem);

    }
);


// ==============================================
// SALA CRIADA
// ==============================================

s.on(
    "salaCriada",
    c => {

        dono = true;

        salaAtual = c;

        abrir(c);

    }
);


// ==============================================
// ENTROU
// ==============================================

s.on(
    "entrouSala",
    c => {

        salaAtual = c;

        abrir(c);

    }
);


// ==============================================
// NOVO DONO
// ==============================================

s.on(
    "novoDono",
    id => {

        if(id === s.id){

            dono = true;

            alert(
                "👑 Você agora é o dono da sala!"
            );

        }

    }
);


// ==============================================
// ESTADO DA SALA
// ==============================================

s.on(
    "estadoSala",
    x => {

        players.innerHTML =
            x.jogadores
            .map(p => `

                <span class="player">

                    👤
                    ${escapeHTML(p.nome)}

                    —
                    ${p.pontos}
                    pts

                </span>

            `)
            .join("");


        start.style.display =
            dono &&
            !x.iniciada
            ?
            "inline-block"
            :
            "none";

    }
);


// ==============================================
// NOVA RODADA
// ==============================================

s.on(
    "rodada",
    x => {

        respostasCard.classList.remove(
            "hidden"
        );

        votacaoCard.classList.add(
            "hidden"
        );

        resultadoVotacaoCard.classList.add(
            "hidden"
        );

        res.classList.add(
            "hidden"
        );


        letra.textContent =
            x.letra;


        tempo.textContent =
            x.tempo + "s";


        cats.innerHTML =
            x.categorias
            .map(c => `

                <div class="categoria">

                    <b>
                        ${escapeHTML(c)}
                    </b>

                    <br>

                    <input
                        id="c_${escapeHTML(c)}"
                        placeholder="${escapeHTML(c)}"
                        autocomplete="off"
                        oninput="
                            salvarCampo(
                                '${escapeHTML(c)}',
                                this.value
                            )
                        "
                    >

                </div>

            `)
            .join("");

    }
);


// ==============================================
// SALVAR CADA CAMPO INDIVIDUALMENTE
// ==============================================

function salvarCampo(
    categoria,
    resposta
){

    s.emit(
        "respostaDigitada",
        {

            categoria,

            resposta

        }
    );

}


// ==============================================
// TEMPO DA RODADA
// ==============================================

s.on(
    "tempo",
    x => {

        tempo.textContent =
            x + "s";

    }
);


// ==============================================
// TEMPO ACABOU
// ==============================================

s.on(
    "tempoAcabou",
    () => {

        tempo.textContent =
            "⏰ TEMPO ACABOU!";

        bloquearRespostas();

    }
);


// ==============================================
// STOP
// ==============================================

s.on(
    "stop",
    x => {

        bloquearRespostas();


        if(
            x.jogadorId === s.id
        ){

            mostrarMensagem(
                "🛑 Você apertou STOP!"
            );

        }

        else{

            mostrarMensagem(
                "🛑 STOP! A rodada terminou."
            );

        }

    }
);


// ==============================================
// COMEÇOU A VOTAÇÃO
// ==============================================

s.on(
    "votacao",
    x => {

        respostasCard.classList.add(
            "hidden"
        );

        resultadoVotacaoCard.classList.add(
            "hidden"
        );

        votacaoCard.classList.remove(
            "hidden"
        );


        categoriaAtual =
            x.categoria;


        // Limpa votos da categoria anterior

        for(
            const chave in meusVotos
        ){

            delete meusVotos[chave];

        }


        tituloVotacao.textContent =
            "🗳️ Votação — " +
            x.categoria;


        progresso.textContent =
            "Categoria " +
            x.numeroCategoria +
            " de " +
            x.totalCategorias;


        tempoVotacao.textContent =
            "⏱️ Tempo para votar: " +
            x.tempo +
            "s";


        mostrarVotacoes(
            x.respostas
        );

    }
);


// ==============================================
// TEMPO DA VOTAÇÃO
// ==============================================

s.on(
    "tempoVotacao",
    segundos => {

        tempoVotacao.textContent =
            "⏱️ Tempo para votar: " +
            segundos +
            "s";

    }
);


// ==============================================
// MOSTRAR TODAS AS RESPOSTAS
// ==============================================

function mostrarVotacoes(
    respostas
){

    votacoes.innerHTML = "";


    respostas.forEach(
        respostaJogador => {

            const div =
                document.createElement(
                    "div"
                );


            div.className =
                "votacao-resposta";


            const resposta =
                respostaJogador.resposta
                .trim();


            // ========================================
            // PRÓPRIA RESPOSTA
            // ========================================

            if(
                respostaJogador.jogadorId ===
                s.id
            ){

                div.classList.add(
                    "propria"
                );


                div.innerHTML = `

                    <div class="nome-jogador">

                        👤
                        ${escapeHTML(
                            respostaJogador.nome
                        )}

                    </div>

                    <div class="resposta-texto">

                        ${
                            resposta
                            ?
                            escapeHTML(
                                resposta
                            )
                            :
                            "(sem resposta)"
                        }

                    </div>

                    <div class="sem-voto">

                        🚫 Esta é sua resposta.
                        Você não pode votar nela.

                    </div>

                `;

            }


            // ========================================
            // RESPOSTA DOS OUTROS
            // ========================================

            else{

                div.innerHTML = `

                    <div class="nome-jogador">

                        👤
                        ${escapeHTML(
                            respostaJogador.nome
                        )}

                    </div>

                    <div class="resposta-texto">

                        ${
                            resposta
                            ?
                            escapeHTML(
                                resposta
                            )
                            :
                            "(sem resposta)"
                        }

                    </div>

                    <div
                        class="botoes-voto"
                    >

                        <button
                            class="correct"
                            onclick="
                                votar(
                                    '${respostaJogador.jogadorId}',
                                    'correta',
                                    this
                                )
                            "
                        >
                            ✅ CORRETA
                        </button>


                        <button
                            class="wrong"
                            onclick="
                                votar(
                                    '${respostaJogador.jogadorId}',
                                    'errada',
                                    this
                                )
                            "
                        >
                            ❌ ERRADA
                        </button>

                    </div>


                    <div
                        class="voto-mensagem"
                        id="
                            voto_${respostaJogador.jogadorId}
                        "
                    ></div>

                `;

            }


            votacoes.appendChild(
                div
            );

        }
    );

}


// ==============================================
// VOTAR
// ==============================================

function votar(
    jogadorId,
    voto,
    botao
){

    // Já votou nessa resposta?

    if(
        meusVotos[jogadorId]
    ){

        return;

    }


    // Registra localmente

    meusVotos[jogadorId] =
        voto;


    // Envia para o servidor

    s.emit(
        "votar",
        {

            jogadorId,

            voto

        }
    );


    // Desativa SOMENTE os dois
    // botões dessa resposta

    const container =
        botao.parentElement;


    const botoes =
        container.querySelectorAll(
            "button"
        );


    botoes.forEach(
        b => {

            b.disabled =
                true;

        }
    );


    // Mostra mensagem

    const mensagem =
        container
        .parentElement
        .querySelector(
            ".voto-mensagem"
        );


    if(mensagem){

        mensagem.textContent =
            voto === "correta"
            ?
            "✅ Você votou: CORRETA"
            :
            "❌ Você votou: ERRADA";

    }


    // Destaca o card

    container
        .parentElement
        .classList.add(
            "votou"
        );

}


// ==============================================
// CONFIRMAÇÃO DO SERVIDOR
// ==============================================

s.on(
    "votoRegistrado",
    dados => {

        console.log(
            "Voto registrado:",
            dados
        );

    }
);


// ==============================================
// RESULTADO DA CATEGORIA
// ==============================================

s.on(
    "resultadoVotacao",
    x => {

        votacaoCard.classList.add(
            "hidden"
        );

        resultadoVotacaoCard.classList.remove(
            "hidden"
        );


        resultadoVotacao.innerHTML = `

            <h3>
                ${escapeHTML(
                    x.categoria
                )}
            </h3>

            ${
                x.resultados
                .map(r => {

                    let classe = "";

                    let texto = "";


                    if(
                        r.resultado.resultado ===
                        "correta"
                    ){

                        classe =
                            "aprovada";

                        texto =
                            "✅ APROVADA — +10 pontos";

                    }

                    else if(
                        r.resultado.resultado ===
                        "errada"
                    ){

                        classe =
                            "reprovada";

                        texto =
                            "❌ REPROVADA — 0 pontos";

                    }

                    else{

                        classe =
                            "empate";

                        texto =
                            "⚖️ EMPATE — 0 pontos";

                    }


                    return `

                        <div
                            class="
                                votacao-resposta
                                ${classe}
                            "
                        >

                            <div class="nome-jogador">

                                👤
                                ${escapeHTML(
                                    r.nome
                                )}

                            </div>

                            <div class="resposta-texto">

                                ${
                                    r.resposta
                                    ?
                                    escapeHTML(
                                        r.resposta
                                    )
                                    :
                                    "(sem resposta)"
                                }

                            </div>

                            <div>

                                ✅
                                ${r.resultado.corretos}
                                votos

                                &nbsp;&nbsp;

                                ❌
                                ${r.resultado.errados}
                                votos

                            </div>

                            <strong>

                                ${texto}

                            </strong>

                        </div>

                    `;

                })
                .join("")
            }

            <p>
                ⏭️ Próxima categoria em breve...
            </p>

        `;

    }
);


// ==============================================
// RESULTADO FINAL
// ==============================================

s.on(
    "resultado",
    x => {

        respostasCard.classList.add(
            "hidden"
        );

        votacaoCard.classList.add(
            "hidden"
        );

        resultadoVotacaoCard.classList.add(
            "hidden"
        );

        res.classList.remove(
            "hidden"
        );


        const jogadores =
            [...x].sort(
                (a,b) =>
                    b.pontos -
                    a.pontos
            );


        res.innerHTML = `

            <h2>
                🏆 Resultado Final
            </h2>

            ${
                jogadores
                .map(
                    (p,index) => {

                        let medalha = "";

                        if(index === 0)
                            medalha = "🥇";

                        if(index === 1)
                            medalha = "🥈";

                        if(index === 2)
                            medalha = "🥉";


                        const classe =
                            index === 0
                            ?
                            "resultado-jogador primeiro"
                            :
                            "resultado-jogador";


                        return `

                            <div
                                class="${classe}"
                            >

                                <h3>

                                    ${medalha}

                                    ${index + 1}º

                                    ${escapeHTML(
                                        p.nome
                                    )}

                                </h3>

                                <p>

                                    +
                                    ${p.pontosRodada}
                                    pontos nesta rodada

                                </p>

                                <strong>

                                    🏆 Total:
                                    ${p.pontos}
                                    pontos

                                </strong>

                            </div>

                        `;

                    }
                )
                .join("")
            }


            ${
                dono
                ?
                `
                    <button
                        onclick="proxima()"
                    >
                        🔄 Próxima rodada
                    </button>
                `
                :
                `
                    <p>
                        ⏳ Aguardando o dono...
                    </p>
                `
            }

        `;

    }
);


// ==============================================
// AGUARDANDO PRÓXIMA RODADA
// ==============================================

s.on(
    "aguardando",
    () => {

        res.classList.add(
            "hidden"
        );

        votacaoCard.classList.add(
            "hidden"
        );

        resultadoVotacaoCard.classList.add(
            "hidden"
        );

        respostasCard.classList.remove(
            "hidden"
        );


        letra.textContent =
            "?";


        tempo.textContent =
            "";


        cats.innerHTML =
            "";

    }
);


// ==============================================
// FUNÇÕES
// ==============================================

function status(x){

    document.getElementById(
        "status"
    ).textContent = x;

}


function abrir(c){

    codigo.textContent =
        c;

    menu.classList.add(
        "hidden"
    );

    jogo.classList.remove(
        "hidden"
    );

}


function criar(){

    const nome =
        nomeInput.value.trim();


    if(!nome){

        alert(
            "Digite seu nome!"
        );

        return;

    }


    s.emit(
        "criarSala",
        nome
    );

}


function entrar(){

    const nome =
        nomeInput.value.trim();


    const codin =
        codigoInput.value
        .trim()
        .toUpperCase();


    if(!nome){

        alert(
            "Digite seu nome!"
        );

        return;

    }


    if(!codin){

        alert(
            "Digite o código!"
        );

        return;

    }


    s.emit(
        "entrarSala",
        {

            nome,

            codigo:codin

        }
    );

}


// ==============================================
// INICIAR
// ==============================================

function iniciar(){

    s.emit(
        "iniciar"
    );

}


// ==============================================
// COLETAR RESPOSTAS
// ==============================================

function coletarRespostas(){

    const respostas = {};


    document
    .querySelectorAll(
        "#cats input"
    )
    .forEach(
        input => {

            const categoria =
                input.id.substring(2);


            respostas[
                categoria
            ] =
                input.value.trim();

        }
    );


    return respostas;

}


// ==============================================
// BOTÃO ENVIAR
// ==============================================

function enviar(){

    const respostas =
        coletarRespostas();


    s.emit(
        "respostas",
        respostas
    );


    mostrarMensagem(
        "📤 Respostas salvas!"
    );

}


// ==============================================
// STOP
// ==============================================

function enviarStop(){

    // Primeiro salva absolutamente
    // tudo que está nos campos

    const respostas =
        coletarRespostas();


    s.emit(
        "respostas",
        respostas
    );


    // Depois STOP

    s.emit(
        "stop"
    );

}


// ==============================================
// BLOQUEAR CAMPOS
// ==============================================

function bloquearRespostas(){

    document
    .querySelectorAll(
        "#cats input"
    )
    .forEach(
        input => {

            input.disabled =
                true;

        }
    );

}


// ==============================================
// PRÓXIMA
// ==============================================

function proxima(){

    s.emit(
        "proxima"
    );

}


// ==============================================
// MENSAGEM
// ==============================================

function mostrarMensagem(
    texto
){

    const div =
        document.createElement(
            "div"
        );


    div.textContent =
        texto;


    div.style.background =
        "#374151";

    div.style.padding =
        "15px";

    div.style.borderRadius =
        "10px";

    div.style.margin =
        "10px";


    document
    .querySelector("main")
    .prepend(div);


    setTimeout(
        () => {

            div.remove();

        },
        2500
    );

}


// ==============================================
// SEGURANÇA HTML
// ==============================================

function escapeHTML(texto){

    return String(texto)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}
