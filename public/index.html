<!DOCTYPE html>

<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>STOP Multiplayer</title>

<script src="/socket.io/socket.io.js"></script>

<style>

* {
    box-sizing: border-box;
}

body {

    margin: 0;

    font-family: Arial, sans-serif;

    background:
        linear-gradient(
            135deg,
            #111827,
            #1f2937
        );

    color: white;

    min-height: 100vh;

    padding: 20px;
}

.container {

    width: 100%;

    max-width: 1100px;

    margin: auto;
}

h1 {

    text-align: center;

    font-size: 70px;

    margin: 10px 0 30px;

    color: #ef4444;

    text-shadow:
        0 0 20px rgba(239,68,68,0.5);
}

h2 {

    text-align: center;

    margin-bottom: 20px;
}

.card {

    background: #1e293b;

    border-radius: 15px;

    padding: 25px;

    margin-bottom: 20px;

    box-shadow:
        0 10px 30px rgba(0,0,0,0.3);
}

input {

    width: 100%;

    padding: 14px;

    margin: 8px 0;

    border: none;

    border-radius: 8px;

    font-size: 18px;
}

button {

    border: none;

    border-radius: 8px;

    padding: 13px 20px;

    margin: 5px;

    font-size: 17px;

    font-weight: bold;

    cursor: pointer;

    transition: 0.2s;
}

button:hover {

    transform: scale(1.04);
}

.btn-primary {

    background: #2563eb;

    color: white;
}

.btn-success {

    background: #16a34a;

    color: white;
}

.btn-danger {

    background: #dc2626;

    color: white;
}

.btn-correct {

    background: #16a34a;

    color: white;
}

.btn-wrong {

    background: #dc2626;

    color: white;
}

button:disabled {

    opacity: 0.45;

    cursor: not-allowed;

    transform: none;
}

.hidden {

    display: none !important;
}

.room-code {

    text-align: center;

    font-size: 35px;

    font-weight: bold;

    color: #facc15;

    letter-spacing: 5px;

    margin: 15px;
}

.players {

    display: grid;

    grid-template-columns:
        repeat(auto-fit, minmax(180px, 1fr));

    gap: 10px;

    margin-top: 20px;
}

.player {

    background: #334155;

    padding: 15px;

    border-radius: 10px;

    text-align: center;
}

.letter {

    text-align: center;

    font-size: 80px;

    font-weight: bold;

    color: #facc15;

    margin: 10px;
}

.timer {

    text-align: center;

    font-size: 40px;

    font-weight: bold;

    color: #38bdf8;

    margin: 15px;
}

.categories {

    display: grid;

    grid-template-columns:
        repeat(auto-fit, minmax(250px, 1fr));

    gap: 15px;
}

.category {

    background: #334155;

    padding: 15px;

    border-radius: 10px;
}

.category label {

    display: block;

    font-size: 20px;

    font-weight: bold;

    margin-bottom: 8px;

    color: #facc15;
}

.stop-area {

    text-align: center;

    margin-top: 25px;
}

.stop-button {

    width: 220px;

    height: 80px;

    border-radius: 50%;

    background: #dc2626;

    color: white;

    font-size: 30px;

    box-shadow:
        0 0 30px rgba(220,38,38,0.5);
}

.voting-title {

    text-align: center;

    font-size: 35px;

    color: #facc15;

    margin-bottom: 20px;
}

.answer-card {

    background: #334155;

    border-radius: 12px;

    padding: 20px;

    margin-bottom: 15px;

    border: 2px solid transparent;
}

.answer-card h3 {

    margin-top: 0;

    color: #38bdf8;
}

.answer-text {

    font-size: 26px;

    background: #0f172a;

    padding: 15px;

    border-radius: 8px;

    margin: 15px 0;

    word-break: break-word;
}

.vote-buttons {

    display: flex;

    gap: 10px;

    flex-wrap: wrap;
}

.vote-status {

    padding: 12px;

    border-radius: 8px;

    background: #475569;

    margin-top: 10px;

    font-weight: bold;
}

.my-answer {

    border-color: #64748b;

    opacity: 0.8;
}

.result-card {

    background: #334155;

    padding: 15px;

    margin: 10px 0;

    border-radius: 10px;
}

.correct {

    border-left: 6px solid #22c55e;
}

.wrong {

    border-left: 6px solid #ef4444;
}

.score {

    color: #facc15;

    font-weight: bold;
}

.ranking {

    text-align: center;
}

.rank-item {

    background: #334155;

    padding: 18px;

    border-radius: 10px;

    margin: 10px 0;

    font-size: 22px;
}

.rank-1 {

    font-size: 30px;

    background: #854d0e;
}

.message {

    text-align: center;

    font-size: 20px;

    margin: 15px;

    color: #facc15;
}

.small {

    color: #94a3b8;

    font-size: 14px;
}

</style>

</head>

<body>

<div class="container">

<h1>🛑 STOP</h1>

<!-- ================================= -->
<!-- MENU -->
<!-- ================================= -->

<div id="menu" class="card">

    <h2>Entrar no jogo</h2>

    <input
        type="text"
        id="nome"
        placeholder="Digite seu nome"
    >

    <button
        class="btn-success"
        onclick="criarSala()"
    >
        Criar sala
    </button>

    <hr>

    <input
        type="text"
        id="codigo"
        placeholder="Código da sala"
        maxlength="4"
    >

    <button
        class="btn-primary"
        onclick="entrarSala()"
    >
        Entrar na sala
    </button>

</div>

<!-- ================================= -->
<!-- SALA -->
<!-- ================================= -->

<div id="sala" class="card hidden">

    <h2>Sala</h2>

    <div
        id="codigoSala"
        class="room-code"
    >
    </div>

    <p class="small" style="text-align:center;">
        Compartilhe este código com os outros jogadores.
    </p>

    <h2>Jogadores</h2>

    <div
        id="listaJogadores"
        class="players"
    >
    </div>

    <div style="text-align:center; margin-top:20px;">

        <button
            id="botaoIniciar"
            class="btn-success"
            onclick="iniciarJogo()"
        >
            ▶️ Iniciar jogo
        </button>

    </div>

</div>

<!-- ================================= -->
<!-- JOGO -->
<!-- ================================= -->

<div
    id="jogo"
    class="card hidden"
>

    <h2>Rodada</h2>

    <div
        id="letra"
        class="letter"
    >
    </div>

    <div
        id="timer"
        class="timer"
    >
        60
    </div>

    <div
        id="mensagemRodada"
        class="message"
    >
        Preencha todas as categorias!
    </div>

    <div
        id="categorias"
        class="categories"
    >
    </div>

    <div class="stop-area">

        <button
            class="stop-button"
            onclick="enviarStop()"
        >
            STOP!
        </button>

    </div>

</div>

<!-- ================================= -->
<!-- VOTAÇÃO -->
<!-- ================================= -->

<div
    id="votacao"
    class="card hidden"
>

    <div
        id="tituloVotacao"
        class="voting-title"
    >
    </div>

    <div
        id="timerVotacao"
        class="timer"
    >
        60
    </div>

    <div
        id="explicacaoVotacao"
        class="message"
    >
        Vote nas respostas dos outros jogadores.
    </div>

    <div
        id="listaRespostas"
    >
    </div>

</div>

<!-- ================================= -->
<!-- RESULTADO DA CATEGORIA -->
<!-- ================================= -->

<div
    id="resultadoCategoria"
    class="card hidden"
>

    <h2>Resultado da categoria</h2>

    <div
        id="resultadoCategoriaConteudo"
    >
    </div>

</div>

<!-- ================================= -->
<!-- RESULTADO FINAL -->
<!-- ================================= -->

<div
    id="resultadoFinal"
    class="card hidden"
>

    <h2>🏆 Resultado Final</h2>

    <div
        id="ranking"
        class="ranking"
    >
    </div>

    <div style="text-align:center;">

        <button
            class="btn-primary"
            onclick="voltarSala()"
        >
            Voltar para a sala
        </button>

    </div>

</div>

</div>

<script>

// ==========================================
// SOCKET
// ==========================================

const socket = io();

let meuId = null;
let codigoAtual = "";
let categoriasAtuais = [];

let respostasLocais = {};

let faseAtual = "";

// ==========================================
// CONEXÃO
// ==========================================

socket.on("connect", () => {

    meuId = socket.id;

});

// ==========================================
// ERRO
// ==========================================

socket.on("erro", mensagem => {

    alert(mensagem);

});

// ==========================================
// CRIAR SALA
// ==========================================

function criarSala() {

    const nome =
        document.getElementById("nome")
            .value
            .trim();

    if (!nome) {

        alert("Digite seu nome.");

        return;
    }

    socket.emit(
        "criarSala",
        nome
    );
}

// ==========================================
// SALA CRIADA
// ==========================================

socket.on("salaCriada", dados => {

    codigoAtual = dados.codigo;

    entrarNaTelaSala();

});

// ==========================================
// ENTRAR NA SALA
// ==========================================

function entrarSala() {

    const nome =
        document.getElementById("nome")
            .value
            .trim();

    const codigo =
        document.getElementById("codigo")
            .value
            .trim()
            .toUpperCase();

    if (!nome) {

        alert("Digite seu nome.");

        return;
    }

    if (!codigo) {

        alert("Digite o código da sala.");

        return;
    }

    socket.emit(
        "entrarSala",
        {
            nome: nome,
            codigo: codigo
        }
    );
}

// ==========================================
// ENTROU
// ==========================================

socket.on("entrouSala", dados => {

    codigoAtual = dados.codigo;

    entrarNaTelaSala();

});

// ==========================================
// MOSTRAR SALA
// ==========================================

function entrarNaTelaSala() {

    document
        .getElementById("menu")
        .classList.add("hidden");

    document
        .getElementById("sala")
        .classList.remove("hidden");

    document
        .getElementById("codigoSala")
        .textContent = codigoAtual;

}

// ==========================================
// ESTADO DA SALA
// ==========================================

socket.on("estadoSala", sala => {

    codigoAtual = sala.codigo;

    document
        .getElementById("codigoSala")
        .textContent = sala.codigo;

    const lista =
        document.getElementById(
            "listaJogadores"
        );

    lista.innerHTML = "";

    sala.jogadores.forEach(jogador => {

        const div =
            document.createElement("div");

        div.className = "player";

        div.innerHTML = `
            <strong>${jogador.nome}</strong>
            <br>
            <span class="score">
                ${formatarPontos(jogador.pontos)} pontos
            </span>
        `;

        if (jogador.id === sala.dono) {

            div.innerHTML += `
                <br>
                👑 Dono
            `;
        }

        lista.appendChild(div);
    });

    const botao =
        document.getElementById(
            "botaoIniciar"
        );

    if (sala.dono === meuId) {

        botao.classList.remove("hidden");

    } else {

        botao.classList.add("hidden");
    }

});

// ==========================================
// NOVO DONO
// ==========================================

socket.on("novoDono", novoDono => {

    if (novoDono === meuId) {

        document
            .getElementById("botaoIniciar")
            .classList.remove("hidden");
    }

});

// ==========================================
// INICIAR
// ==========================================

function iniciarJogo() {

    socket.emit("iniciar");

}

// ==========================================
// NOVA RODADA
// ==========================================

socket.on("rodada", dados => {

    faseAtual = "respostas";

    categoriasAtuais =
        dados.categorias;

    respostasLocais = {};

    document
        .getElementById("sala")
        .classList.add("hidden");

    document
        .getElementById("jogo")
        .classList.remove("hidden");

    document
        .getElementById("votacao")
        .classList.add("hidden");

    document
        .getElementById("resultadoCategoria")
        .classList.add("hidden");

    document
        .getElementById("resultadoFinal")
        .classList.add("hidden");

    document
        .getElementById("letra")
        .textContent = dados.letra;

    criarCamposCategorias();

});

// ==========================================
// CRIAR CATEGORIAS
// ==========================================

function criarCamposCategorias() {

    const container =
        document.getElementById(
            "categorias"
        );

    container.innerHTML = "";

    categoriasAtuais.forEach(categoria => {

        const div =
            document.createElement("div");

        div.className = "category";

        div.innerHTML = `

            <label>
                ${categoria}
            </label>

            <input
                type="text"
                id="campo-${categoria}"
                placeholder="Digite aqui..."
                autocomplete="off"
            >

        `;

        container.appendChild(div);

        const input =
            div.querySelector("input");

        input.addEventListener(
            "input",
            () => {

                salvarCampo(
                    categoria,
                    input.value
                );

            }
        );
    });

}

// ==========================================
// SALVAR CAMPO
// ==========================================

function salvarCampo(
    categoria,
    resposta
) {

    respostasLocais[categoria] =
        resposta;

    socket.emit(
        "respostaDigitada",
        {
            categoria: categoria,
            resposta: resposta
        }
    );

}

// ==========================================
// STOP
// ==========================================

function enviarStop() {

    const respostas = {};

    categoriasAtuais.forEach(categoria => {

        const campo =
            document.getElementById(
                `campo-${categoria}`
            );

        respostas[categoria] =
            campo
                ? campo.value.trim()
                : "";
    });

    socket.emit(
        "respostas",
        respostas
    );

    socket.emit("stop");

}

// ==========================================
// STOP RECEBIDO
// ==========================================

socket.on("stop", () => {

    faseAtual = "votacao";

    document
        .getElementById("jogo")
        .classList.add("hidden");

    document
        .getElementById("votacao")
        .classList.remove("hidden");

});

// ==========================================
// TIMER
// ==========================================

socket.on("tempo", dados => {

    const timer =
        document.getElementById(
            dados.fase === "respostas"
                ? "timer"
                : "timerVotacao"
        );

    if (timer) {

        timer.textContent =
            dados.tempo;
    }

});

// ==========================================
// VOTAÇÃO
// ==========================================

socket.on("votacao", dados => {

    faseAtual = "votacao";

    document
        .getElementById("jogo")
        .classList.add("hidden");

    document
        .getElementById("resultadoCategoria")
        .classList.add("hidden");

    document
        .getElementById("votacao")
        .classList.remove("hidden");

    document
        .getElementById("resultadoFinal")
        .classList.add("hidden");

    document
        .getElementById("tituloVotacao")
        .textContent =
            `🗳️ Categoria: ${dados.categoria}`;

    document
        .getElementById("timerVotacao")
        .textContent =
            dados.tempo;

    const lista =
        document.getElementById(
            "listaRespostas"
        );

    lista.innerHTML = "";

    dados.respostas.forEach(item => {

        const card =
            document.createElement("div");

        card.className =
            "answer-card";

        if (item.jogadorId === meuId) {

            card.classList.add(
                "my-answer"
            );

            card.innerHTML = `

                <h3>
                    ${item.jogadorNome}
                </h3>

                <div class="answer-text">
                    ${item.resposta || "(vazio)"}
                </div>

                <div class="vote-status">
                    🚫 Esta é sua resposta.
                    Você não pode votar nela.
                </div>

            `;

        } else {

            card.innerHTML = `

                <h3>
                    ${item.jogadorNome}
                </h3>

                <div class="answer-text">
                    ${item.resposta || "(vazio)"}
                </div>

                <div
                    class="vote-buttons"
                    id="votos-${item.jogadorId}"
                >

                    <button
                        class="btn-correct"
                        onclick="
                            votar(
                                '${item.jogadorId}',
                                'correta',
                                this
                            )
                        "
                    >
                        ✅ Correta
                    </button>

                    <button
                        class="btn-wrong"
                        onclick="
                            votar(
                                '${item.jogadorId}',
                                'errada',
                                this
                            )
                        "
                    >
                        ❌ Errada
                    </button>

                </div>

            `;
        }

        lista.appendChild(card);

    });

});

// ==========================================
// VOTAR
// ==========================================

function votar(
    jogadorId,
    voto,
    botao
) {

    const area =
        document.getElementById(
            `votos-${jogadorId}`
        );

    if (!area) {
        return;
    }

    const botoes =
        area.querySelectorAll("button");

    botoes.forEach(b => {

        b.disabled = true;

    });

    area.innerHTML += `

        <div class="vote-status">

            ${
                voto === "correta"
                    ? "✅ Você marcou esta resposta como correta."
                    : "❌ Você marcou esta resposta como errada."
            }

        </div>

    `;

    socket.emit(
        "votar",
        {
            jogadorId: jogadorId,
            voto: voto
        }
    );

}

// ==========================================
// VOTO REGISTRADO
// ==========================================

socket.on(
    "votoRegistrado",
    dados => {

        // A interface já foi atualizada
        // imediatamente ao clicar.

    }
);

// ==========================================
// RESULTADO DA CATEGORIA
// ==========================================

socket.on(
    "resultadoCategoria",
    dados => {

        document
            .getElementById("votacao")
            .classList.add("hidden");

        document
            .getElementById(
                "resultadoCategoria"
            )
            .classList.remove("hidden");

        const container =
            document.getElementById(
                "resultadoCategoriaConteudo"
            );

        container.innerHTML = "";

        dados.resultados.forEach(resultado => {

            const div =
                document.createElement("div");

            div.className =
                "result-card " +
                (
                    resultado.correta
                        ? "correct"
                        : "wrong"
                );

            let mensagemPontos = "";

            if (resultado.correta) {

                if (
                    resultado.quantidadeIguais > 1
                ) {

                    mensagemPontos = `
                        <p>
                            👥
                            ${resultado.quantidadeIguais}
                            pessoas deram a mesma resposta.
                        </p>

                        <p class="score">
                            10 ÷
                            ${resultado.quantidadeIguais}
                            =
                            ${formatarPontos(
                                resultado.pontosGanhos
                            )}
                            pontos
                        </p>
                    `;

                } else {

                    mensagemPontos = `
                        <p class="score">
                            +10 pontos
                        </p>
                    `;
                }

            } else {

                mensagemPontos = `
                    <p class="score">
                        +0 pontos
                    </p>
                `;
            }

            div.innerHTML = `

                <strong>
                    ${resultado.jogadorNome}
                </strong>

                <p>
                    Resposta:
                    <strong>
                        ${resultado.resposta || "(vazio)"}
                    </strong>
                </p>

                <p>
                    ${resultado.correta
                        ? "✅ Resposta aprovada"
                        : "❌ Resposta reprovada"
                    }
                </p>

                <p>
                    👍 ${resultado.votosCorretos}
                    &nbsp;&nbsp;
                    👎 ${resultado.votosErrados}
                </p>

                ${mensagemPontos}

                <p>
                    Total:
                    <strong class="score">
                        ${formatarPontos(
                            resultado.pontosTotais
                        )}
                    </strong>
                </p>

            `;

            container.appendChild(div);

        });

    }
);

// ==========================================
// RESULTADO FINAL
// ==========================================

socket.on(
    "resultadoFinal",
    dados => {

        document
            .getElementById("jogo")
            .classList.add("hidden");

        document
            .getElementById("votacao")
            .classList.add("hidden");

        document
            .getElementById(
                "resultadoCategoria"
            )
            .classList.add("hidden");

        document
            .getElementById("resultadoFinal")
            .classList.remove("hidden");

        const ranking =
            document.getElementById(
                "ranking"
            );

        ranking.innerHTML = "";

        dados.ranking.forEach(jogador => {

            const div =
                document.createElement("div");

            div.className =
                "rank-item";

            if (jogador.posicao === 1) {

                div.classList.add("rank-1");
            }

            let medalha = "";

            if (jogador.posicao === 1) {
                medalha = "🥇";
            }

            else if (jogador.posicao === 2) {
                medalha = "🥈";
            }

            else if (jogador.posicao === 3) {
                medalha = "🥉";
            }

            div.innerHTML = `

                ${medalha}

                <strong>
                    ${jogador.posicao}º
                    ${jogador.nome}
                </strong>

                <br>

                <span class="score">
                    ${formatarPontos(
                        jogador.pontos
                    )}
                    pontos
                </span>

            `;

            ranking.appendChild(div);

        });

    }
);

// ==========================================
// FORMATAR PONTOS
// ==========================================

function formatarPontos(pontos) {

    return Number(pontos || 0)
        .toFixed(2)
        .replace(".", ",");
}

// ==========================================
// VOLTAR PARA SALA
// ==========================================

function voltarSala() {

    document
        .getElementById("resultadoFinal")
        .classList.add("hidden");

    document
        .getElementById("sala")
        .classList.remove("hidden");

}

</script>

</body>

</html>
